name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Verificar formato
        run: pnpm format:check

      - name: Pruebas unitarias
        run: pnpm test

      - name: Compilar
        run: pnpm build

      - name: Pruebas de interfaz
        timeout-minutes: 15
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:ui

      - name: Pruebas de permisos por sección
        timeout-minutes: 10
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:permisos

      - name: Pruebas de accesibilidad
        timeout-minutes: 10
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:a11y

      - name: Guardar capturas si falla una prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interfaz
          path: artifacts/
          retention-days: 7
