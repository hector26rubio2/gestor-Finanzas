name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formato
        run: pnpm format:check
      - name: Pruebas
        run: pnpm test
      - name: Compilar
        run: pnpm build
      - name: Pruebas de interfaz
        timeout-minutes: 15
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:ui
      - name: Permisos por seccion
        timeout-minutes: 10
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:permisos
      - name: Accesibilidad
        timeout-minutes: 10
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:a11y
      - name: Guardar capturas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interfaz
          path: artifacts/
          retention-days: 7
