name: CI

# El flujo de despliegue solo compilaba: un fallo de lint, de formato o una
# prueba rota llegaba a Pages sin que nadie lo viera.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formato
        run: pnpm format:check
      - name: Pruebas
        run: pnpm test
      - name: Compilar
        run: pnpm build
      # La suite de interfaz recorre las once rutas en cinco anchos, ejercita los
      # controles y falla si algo se desborda o si la consola escupe un error. Llevaba
      # meses rota y fuera de aqui, y por eso las regresiones visuales se descubrian en
      # produccion, a mano y por capturas de pantalla.
      - name: Pruebas de interfaz
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:ui
      # Un permiso por seccion basta para entrar y ver algo: el modelo acordado, fijado
      # aqui para que ningun permiso fino vuelva a cerrar la puerta.
      - name: Permisos por seccion
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:permisos
      - name: Guardar capturas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interfaz
          path: artifacts/
          retention-days: 7
