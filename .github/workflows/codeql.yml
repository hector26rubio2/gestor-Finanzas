name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b
        with:
          category: /language:javascript-typescript
