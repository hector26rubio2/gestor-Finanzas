name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Escribir config de API desde la variable del repositorio
        if: ${{ vars.API_BASE_URL != '' }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "window.__FINANZAS_CONFIG__ = { mode: 'api', apiBaseUrl: '$API_BASE_URL' };" > public/config.js
      - run: pnpm exec ng build --base-href /gestor-Finanzas/
      - run: touch dist/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
