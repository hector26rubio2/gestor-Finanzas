name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Verificar formato
        run: pnpm format:check

      - name: Pruebas unitarias
        run: pnpm test

      - name: Pruebas de interfaz
        timeout-minutes: 15
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:ui

      - name: Pruebas de permisos por sección
        timeout-minutes: 10
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:permisos

      - name: Pruebas de accesibilidad
        timeout-minutes: 10
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:a11y

      - name: Generar configuración de API
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$API_BASE_URL" || {
            echo "::error::Falta la variable de repositorio API_BASE_URL"
            exit 1
          }

          mkdir -p public
          printf 'window.__FINANZAS_CONFIG__ = { apiBaseUrl: "%s" };\n' \
            "$API_BASE_URL" > public/config.js

      - name: Compilar para el dominio personalizado
        run: pnpm exec ng build --configuration production --base-href /

      - name: Preparar rutas estáticas
        run: node scripts/rutas-estaticas.mjs dist/browser

      - name: Verificar archivos de publicación
        run: |
          test -f dist/browser/index.html || {
            echo "::error::No se encontró dist/browser/index.html"
            exit 1
          }

          test -f dist/browser/config.js || {
            echo "::error::No se encontró dist/browser/config.js"
            exit 1
          }

          test -f dist/browser/CNAME || {
            echo "::warning::No se encontró CNAME en dist/browser"
          }

          echo "Archivos generados:"
          find dist/browser -maxdepth 2 -type f | sort

      - name: Desactivar Jekyll
        run: touch dist/browser/.nojekyll

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
