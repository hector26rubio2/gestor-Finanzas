name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoria de dependencias de produccion
        run: pnpm audit --prod --audit-level high
      - name: Lint
        run: pnpm lint
      - name: Formato
        run: pnpm format:check
      - name: Pruebas
        run: pnpm test
      - name: Pruebas de interfaz
        timeout-minutes: 15
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:ui
      - name: Permisos por seccion
        timeout-minutes: 10
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:permisos
      - name: Accesibilidad
        timeout-minutes: 10
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:a11y
      - name: Escribir config de API desde la variable del repositorio
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$API_BASE_URL" || { echo "::error::Falta la variable de repositorio API_BASE_URL"; exit 1; }
          echo "window.__FINANZAS_CONFIG__ = { apiBaseUrl: '$API_BASE_URL' };" > public/config.js
      - run: pnpm exec ng build --base-href /gestor-Finanzas/
      - run: node scripts/rutas-estaticas.mjs dist/browser
      - run: touch dist/browser/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
