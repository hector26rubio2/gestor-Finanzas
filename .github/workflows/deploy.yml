name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nada se despliega a Pages sin pasar antes lint, formato y pruebas.
      - name: Lint
        run: pnpm lint
      - name: Formato
        run: pnpm format:check
      - name: Pruebas
        run: pnpm test
      - name: Pruebas de interfaz
        # Un cuelgue no puede costar una hora de maquina: si no termina en quince
        # minutos, es que algo espera a lo que no va a llegar.
        timeout-minutes: 15
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:ui
      # Un permiso por seccion basta para entrar y ver algo: el modelo acordado, fijado
      # aqui para que ningun permiso fino vuelva a cerrar la puerta.
      - name: Permisos por seccion
        timeout-minutes: 10
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:permisos
      - name: Escribir config de API desde la variable del repositorio
        if: ${{ vars.API_BASE_URL != '' }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "window.__FINANZAS_CONFIG__ = { mode: 'api', apiBaseUrl: '$API_BASE_URL' };" > public/config.js
      - run: pnpm exec ng build --base-href /gestor-Finanzas/
      - run: cp dist/browser/index.html dist/browser/404.html
      - run: touch dist/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
