<fin-overlay [title]="title()" mode="modal" (closed)="store.form.set(null)">
  <form class="management-form" (ngSubmit)="save()">
    <fin-field [label]="i18n.t('form.field.name')">
      <input name="name" [(ngModel)]="name" required />
    </fin-field>
    @if (kind() === 'category') {
    <fin-field [label]="i18n.t('form.management.field.categoryType')">
      <fin-select
        name="categoryType"
        [(ngModel)]="categoryType"
        [options]="categoryTypeOptions()"
        [ariaLabel]="i18n.t('form.management.field.categoryTypeAria')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.color')">
      <input name="color" type="color" [(ngModel)]="color" />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.icon')">
      <input name="icon" [(ngModel)]="icon" required />
    </fin-field>
    } @if (kind() === 'person') {
    <fin-field [label]="i18n.t('form.management.field.email')">
      <input name="email" type="email" [(ngModel)]="email" />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.relationship')">
      <fin-select
        name="relationship"
        [(ngModel)]="relationship"
        [options]="relationshipOptions()"
        [ariaLabel]="i18n.t('form.management.field.relationshipAria')"
      />
    </fin-field>
    } @if (kind() === 'investment') {
    <fin-field [label]="i18n.t('form.management.field.instrument')">
      <fin-select
        name="instrument"
        [(ngModel)]="instrument"
        [options]="instrumentOptions()"
        [ariaLabel]="i18n.t('form.management.field.instrumentAria')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.field.currency')">
      <fin-select
        name="currency"
        [(ngModel)]="currency"
        [options]="currencyOptions()"
        [ariaLabel]="i18n.t('form.management.field.currencyAria')"
      />
    </fin-field>
    } @if (kind() === 'recurrence') {
    <fin-field [label]="i18n.t('form.field.amount')">
      <input name="amount" type="number" min="1" [(ngModel)]="amount" required />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.account')">
      <fin-select
        name="account"
        [(ngModel)]="accountId"
        [options]="accountOptions()"
        [ariaLabel]="i18n.t('form.management.field.accountAria')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.frequency.label')">
      <fin-select
        name="frequency"
        [(ngModel)]="frequency"
        [options]="frequencyOptions()"
        [ariaLabel]="i18n.t('form.frequency.label')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.start')">
      <input name="start" type="date" [(ngModel)]="start" required />
    </fin-field>
    } @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
    }
    <footer>
      <button type="button" (click)="store.form.set(null)">{{ i18n.t('form.actions.cancel') }}</button
      ><button class="primary" type="submit">{{ i18n.t('form.actions.save') }}</button>
    </footer>
  </form>
</fin-overlay>
