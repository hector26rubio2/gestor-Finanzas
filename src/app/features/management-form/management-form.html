<fin-overlay [title]="title()" mode="modal" (closed)="store.form.set(null)">
  <form class="grid grid-cols-2 gap-4 max-[500px]:grid-cols-1" [formRoot]="formulario">
    @if (kind() === 'person') {
    <div class="col-span-full max-[500px]:col-auto">
      <fin-segmented
        [value]="modelo().personKind"
        [options]="personKindOptions()"
        [ariaLabel]="i18n.t('form.management.field.personKind')"
        (valueChange)="elegirTipoDePersona($event)"
      />
    </div>
    }
    <fin-field [label]="i18n.t('form.field.name')" [error]="mensaje(formulario.name)">
      <input hlmInput [formField]="formulario.name" [attr.aria-label]="i18n.t('form.field.name')" />
    </fin-field>
    @if (kind() === 'category') {
    <fin-field [label]="i18n.t('form.management.field.categoryType')">
      <fin-select
        [formField]="formulario.categoryType"
        [disabled]="!!editingId"
        [options]="categoryTypeOptions()"
        [ariaLabel]="i18n.t('form.management.field.categoryTypeAria')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.color')">
      <input type="color" [formField]="formulario.color" />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.icon')">
      @defer (on idle) {
      <fin-icon-picker [(value)]="icon" [color]="modelo().color" [label]="i18n.t('form.management.field.icon')" />
      } @placeholder {
      <span class="block h-9 rounded-md border border-border"></span>
      }
    </fin-field>
    } @if (kind() === 'person' && modelo().personKind === 'person') {
    <fin-field [label]="i18n.t('form.management.field.email')" [error]="mensaje(formulario.email)">
      <input hlmInput type="email" [formField]="formulario.email" />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.relationship')">
      <fin-select
        [formField]="formulario.relationship"
        [options]="relationshipOptions()"
        [ariaLabel]="i18n.t('form.management.field.relationshipAria')"
      />
    </fin-field>
    } @if (kind() === 'investment') {
    <fin-field [label]="i18n.t('form.management.field.instrument')">
      <fin-select
        [formField]="formulario.instrument"
        [options]="instrumentOptions()"
        [ariaLabel]="i18n.t('form.management.field.instrumentAria')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.field.currency')">
      <fin-select
        [formField]="formulario.currency"
        [disabled]="!!editingId"
        [options]="currencyOptions()"
        [ariaLabel]="i18n.t('form.management.field.currencyAria')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.risk')">
      <fin-select
        [formField]="formulario.risk"
        [options]="riskOptions()"
        [ariaLabel]="i18n.t('form.management.field.risk')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.symbol')">
      <input
        hlmInput
        [formField]="formulario.symbol"
        autocomplete="off"
        [attr.aria-label]="i18n.t('form.management.field.symbol')"
      />
    </fin-field>
    @if (!editingId) {
    <fin-field [label]="i18n.t('form.management.field.institution')">
      <input
        hlmInput
        [formField]="formulario.institution"
        autocomplete="off"
        [attr.aria-label]="i18n.t('form.management.field.institution')"
      />
    </fin-field>
    } } @if (kind() === 'recurrence') {
    <fin-field [label]="i18n.t('form.field.amount')" [error]="mensaje(formulario.amount)">
      <input hlmInput type="number" inputmode="decimal" [formField]="formulario.amount" />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.account')" [error]="mensaje(formulario.accountId)">
      <fin-select
        [formField]="formulario.accountId"
        [options]="accountOptions()"
        [ariaLabel]="i18n.t('form.management.field.accountAria')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.frequency.label')">
      <fin-select
        [formField]="formulario.frequency"
        [options]="frequencyOptions()"
        [ariaLabel]="i18n.t('form.frequency.label')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.management.field.start')" [error]="mensaje(formulario.start)">
      <fin-date-field [formField]="formulario.start" />
    </fin-field>
    } @if (error()) {
    <p class="col-span-full text-destructive max-[500px]:col-auto" role="alert">{{ error() }}</p>
    }
    <footer class="col-span-full flex justify-end gap-2.5 max-[500px]:col-auto">
      <button hlmBtn variant="outline" size="lg" type="button" (click)="store.form.set(null)">
        <fin-icon name="close" /> {{ i18n.t('form.actions.cancel') }}</button
      ><button hlmBtn size="lg" type="submit">{{ i18n.t('form.actions.save') }}</button>
    </footer>
  </form>
</fin-overlay>
