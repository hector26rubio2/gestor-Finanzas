<section class="kpis mini">
  <fin-kpi
    [label]="i18n.t('portfolio.kpi.available.label')"
    icon="wallet"
    [value]="store.money(store.available() - store.debt())"
    [hint]="i18n.t('portfolio.kpi.available.hint')"
  />
  <fin-kpi
    [label]="i18n.t('portfolio.kpi.investments.label')"
    icon="portfolio"
    [value]="store.money(investmentValue())"
    [hint]="i18n.t('portfolio.kpi.investments.hint')"
  />
  <fin-kpi
    [label]="i18n.t('portfolio.kpi.return.label')"
    icon="trendUp"
    tone="success"
    [value]="investmentReturn()"
    [hint]="i18n.t('portfolio.kpi.return.hint')"
  />
  <fin-kpi
    [label]="i18n.t('portfolio.kpi.gain.label')"
    icon="trendUp"
    tone="success"
    [value]="store.money(investmentGain())"
    [hint]="i18n.t('portfolio.kpi.gain.hint')"
  />
</section>
<section class="table-zone">
  <fin-table
    [columns]="investmentColumns()"
    [rows]="investmentRows()"
    (rowSelected)="store.inspect('investment', $event['id'])"
  />
</section>
