<fin-kpi-grid>
  <fin-kpi
    [label]="i18n.t('portfolio.kpi.available.label')"
    icon="wallet"
    [value]="store.money(store.available() - store.debt())"
    [hint]="i18n.t('portfolio.kpi.available.hint')"
  />
  <fin-kpi
    [label]="i18n.t('portfolio.kpi.investments.label')"
    icon="portfolio"
    [value]="store.money(investmentValue())"
    [hint]="i18n.t('portfolio.kpi.investments.hint')"
  />
  <fin-kpi
    [label]="i18n.t('portfolio.kpi.gain.label')"
    icon="trendUp"
    tone="success"
    [value]="store.money(investmentGain())"
    [hint]="i18n.t('portfolio.kpi.gain.hint', { rate: investmentReturn() })"
  />
</fin-kpi-grid>
<section class="grid shrink-0 grid-cols-2 gap-3.5 max-[900px]:grid-cols-1">
  <fin-chart-card
    [title]="i18n.t('portfolio.chart.distribution')"
    [option]="distributionOption()"
    [hasData]="hasInvestments()"
    [empty]="i18n.t('portfolio.chart.empty')"
  />
  <fin-chart-card
    [title]="i18n.t('portfolio.chart.costValue')"
    [option]="costValueOption()"
    [hasData]="hasInvestments()"
    [empty]="i18n.t('portfolio.chart.empty')"
  />
</section>
<fin-table-zone class="min-h-[360px]">
  <fin-table
    [columns]="investmentColumns()"
    [rows]="investmentRows()"
    (rowSelected)="store.inspect('investment', $event['id'])"
  />
</fin-table-zone>
