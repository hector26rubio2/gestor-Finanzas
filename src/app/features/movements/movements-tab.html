<fin-kpi-grid>
  <fin-kpi
    [label]="i18n.t('movements.kpi.income.label')"
    icon="trendUp"
    tone="success"
    [value]="store.money(ingresosMostrados())"
    [hint]="i18n.t(hintDe('income'))"
    [series]="incomeSeries()"
    [delta]="variacion(incomeSeries())"
    [caption]="incomeSeries().length > 1 ? historiaEtiqueta() : ''"
  />
  <fin-kpi
    [label]="i18n.t('movements.kpi.expense.label')"
    icon="trendDown"
    tone="danger"
    [value]="store.money(gastosMostrados())"
    [hint]="i18n.t(hintDe('expense'))"
    [series]="expenseSeries()"
    [delta]="variacion(expenseSeries())"
    [caption]="expenseSeries().length > 1 ? historiaEtiqueta() : ''"
    [subirEsBueno]="false"
  />
  <fin-kpi
    [label]="i18n.t('movements.kpi.records.label')"
    icon="movements"
    [value]="registrosMostrados().toLocaleString()"
    [hint]="i18n.t(hintDe('records'))"
    [series]="recordsSeries()"
    [delta]="variacion(recordsSeries())"
    [caption]="recordsSeries().length > 1 ? historiaEtiqueta() : ''"
  />
  <fin-kpi
    [label]="i18n.t('movements.kpi.recurring.label')"
    icon="calendar"
    [value]="recurringExpenses().toString()"
    [hint]="i18n.t(hintDe('recurring'))"
    [series]="recurringSeries()"
    [delta]="variacion(recurringSeries())"
    [caption]="recurringSeries().length > 1 ? historiaEtiqueta() : ''"
    [subirEsBueno]="false"
  />
  @let debt = longestDebt();
  <fin-kpi
    [label]="i18n.t('movements.kpi.installments.label')"
    icon="clock"
    tone="danger"
    [value]="debt ? i18n.t('movements.kpi.installments.value', { count: debt.remaining }) : i18n.t('movements.kpi.none')"
    [hint]="debt ? i18n.t(hintDe('installments'), { name: debt.description, total: debt.total }) : i18n.t('movements.kpi.installments.empty')"
    [series]="installmentsSeries()"
    [delta]="variacion(installmentsSeries())"
    [caption]="installmentsSeries().length > 1 ? historiaEtiqueta() : ''"
    [subirEsBueno]="false"
  />
  @let top = topCategory();
  <fin-kpi
    [label]="i18n.t('movements.kpi.topCategory.label')"
    icon="trendDown"
    tone="danger"
    [value]="top ? top.category : i18n.t('movements.kpi.none')"
    [hint]="top ? i18n.t(hintDe('topCategory'), { amount: store.money(top.amount) }) : i18n.t('movements.kpi.topCategory.empty')"
  />
</fin-kpi-grid>
<fin-table-zone class="relative" [attr.aria-busy]="book.movementsLoading()">
  @if (book.movementsLoading()) {
  <fin-skeleton class="absolute inset-0 z-[2] overflow-hidden opacity-90" />
  }
  <fin-table
    urlKey="pagina"
    [columns]="book.movementColumns()"
    [rows]="book.movementRows()"
    [pageSize]="store.remoteMovementSize()"
    [totalRows]="store.runtime.mode === 'api' ? store.remoteMovementTotal() : null"
    [remotePage]="store.remoteMovementPage()"
    (pageSizeChange)="changeMovementPageSize($event)"
    (pageChange)="loadMovementPage($event)"
    (rowSelected)="book.inspectMovement($event)"
    [toolbar]="true"
    (pinnedChange)="book.pinned.set($event); loadMovementPage(1)"
  >
    <span finTableTools class="flex items-center gap-2">
      <fin-select
        class="w-36"
        [ngModel]="periodYear()"
        (ngModelChange)="setPeriodYear($event)"
        [options]="yearOptions()"
        [ariaLabel]="i18n.t('movements.filters.period.year')"
      />
      <fin-select
        class="w-36"
        [ngModel]="periodMonth()"
        (ngModelChange)="setPeriodMonth($event)"
        [options]="monthOptions()"
        [disabled]="periodYear() === 'all'"
        [ariaLabel]="i18n.t('movements.filters.period.month')"
      />
    </span>
  </fin-table>
</fin-table-zone>
