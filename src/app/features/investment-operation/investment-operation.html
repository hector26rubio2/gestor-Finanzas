<fin-overlay [title]="i18n.t('form.investment.operation.title')" mode="modal" (closed)="store.form.set(null)">
  <form class="grid grid-cols-2 gap-4 max-[500px]:grid-cols-1" [formRoot]="formulario">
    <fin-field [label]="i18n.t('form.investment.operation.field.type')">
      <fin-select
        [formField]="formulario.type"
        [options]="typeOptions()"
        [ariaLabel]="i18n.t('form.investment.operation.field.type')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.investment.operation.field.date')" [error]="mensaje(formulario.date)">
      <fin-date-field [formField]="formulario.date" [ariaLabel]="i18n.t('form.investment.operation.field.date')" />
    </fin-field>
    <fin-field
      [label]="i18n.t('form.investment.operation.field.amount') + ' (' + currency() + ')'"
      [error]="mensaje(formulario.amount)"
    >
      <input
        hlmInput
        type="number"
        inputmode="decimal"
        [formField]="formulario.amount"
        [attr.aria-label]="i18n.t('form.investment.operation.field.amount')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.investment.operation.field.account')" [error]="mensaje(formulario.account)">
      <fin-select
        [formField]="formulario.account"
        [options]="accountOptions()"
        [ariaLabel]="i18n.t('form.investment.operation.field.account')"
      />
    </fin-field>
    @if (conCantidad()) {
    <fin-field [label]="i18n.t('form.investment.operation.field.quantity')" [error]="mensaje(formulario.quantity)">
      <input
        hlmInput
        type="number"
        inputmode="decimal"
        [formField]="formulario.quantity"
        [attr.aria-label]="i18n.t('form.investment.operation.field.quantity')"
      />
    </fin-field>
    <fin-field [label]="i18n.t('form.investment.operation.field.unitPrice')" [error]="mensaje(formulario.unitPrice)">
      <input
        hlmInput
        type="number"
        inputmode="decimal"
        [formField]="formulario.unitPrice"
        [attr.aria-label]="i18n.t('form.investment.operation.field.unitPrice')"
      />
    </fin-field>
    }
    <fin-field [label]="i18n.t('form.investment.operation.field.description')" [full]="true">
      <input
        hlmInput
        [formField]="formulario.description"
        autocomplete="off"
        [attr.aria-label]="i18n.t('form.investment.operation.field.description')"
      />
    </fin-field>
    @if (error()) {
    <p class="col-span-full text-destructive max-[500px]:col-auto" role="alert">{{ error() }}</p>
    }
    <footer class="col-span-full flex justify-end gap-2.5 max-[500px]:col-auto">
      <button hlmBtn variant="outline" size="lg" type="button" (click)="store.form.set(null)">
        <fin-icon name="close" /> {{ i18n.t('form.actions.cancel') }}</button
      ><button hlmBtn size="lg" type="submit">{{ i18n.t('form.actions.save') }}</button>
    </footer>
  </form>
</fin-overlay>
