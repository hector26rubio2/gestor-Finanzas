<fin-field data-tour="form-recurrente" [label]="i18n.t('form.movement.field.recurring')">
  <fin-select
    name="recurring"
    [(ngModel)]="model['recurring']"
    [options]="recurringOptions()"
    [ariaLabel]="i18n.t('form.movement.field.recurring')"
  />
</fin-field>
@if (model['recurring'] === 'true') {
<fin-field data-tour="form-frecuencia" [label]="i18n.t('form.frequency.label')">
  <fin-select
    name="recurrence"
    [(ngModel)]="model['recurrence']"
    [options]="frequencyOptions()"
    [ariaLabel]="i18n.t('form.frequency.label')"
  />
</fin-field>
}
