<label class="field"
  >{{ i18n.t('form.movement.field.date') }}<input type="date" name="date" [(ngModel)]="model['date']" required
/></label>
<label class="field"
  >{{ sourceAccountLabel() }}<demo-select
    name="accountId"
    [(ngModel)]="model['accountId']"
    [options]="accountOptions()"
    [ariaLabel]="sourceAccountLabel()"
/></label>
@if (showTargetAccount) {
<label class="field"
  >{{ i18n.t('form.movement.field.targetAccount') }}<demo-select
    name="targetId"
    [(ngModel)]="model['targetId']"
    [options]="targetAccountOptions()"
    [ariaLabel]="i18n.t('form.movement.field.targetAccount')"
/></label>
}
<label class="field field-full"
  >{{ i18n.t('form.movement.field.description') }}<input
    type="text"
    name="description"
    [(ngModel)]="model['description']"
    required
/></label>
<label class="field"
  >{{ i18n.t('form.field.amount') }}<input type="number" name="amount" min="1" [(ngModel)]="model['amount']" required
/></label>
