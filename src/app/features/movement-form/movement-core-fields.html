<demo-field [label]="i18n.t('form.movement.field.date')">
  <input type="date" name="date" [(ngModel)]="model['date']" required />
</demo-field>
<demo-field [label]="sourceAccountLabel()">
  <demo-select
    name="accountId"
    [(ngModel)]="model['accountId']"
    [options]="accountOptions()"
    [ariaLabel]="sourceAccountLabel()"
  />
</demo-field>
@if (showTargetAccount) {
<demo-field [label]="i18n.t('form.movement.field.targetAccount')">
  <demo-select
    name="targetId"
    [(ngModel)]="model['targetId']"
    [options]="targetAccountOptions()"
    [ariaLabel]="i18n.t('form.movement.field.targetAccount')"
  />
</demo-field>
}
<demo-field [label]="i18n.t('form.movement.field.description')" [full]="true">
  <input type="text" name="description" [(ngModel)]="model['description']" required />
</demo-field>
<demo-field [label]="i18n.t('form.field.amount')">
  <input type="number" name="amount" min="1" [(ngModel)]="model['amount']" required />
</demo-field>
