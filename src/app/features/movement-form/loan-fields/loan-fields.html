<fin-field [label]="i18n.t('form.movement.field.person')">
  <fin-select
    name="person"
    [(ngModel)]="model['person']"
    (ngModelChange)="onPersonChange($event)"
    [options]="personOptions()"
    [ariaLabel]="i18n.t('form.movement.field.person')"
  />
</fin-field>
@if (showLoanRole()) {
<fin-field [label]="i18n.t('form.movement.field.loanRole')">
  <fin-select
    name="loanRole"
    [(ngModel)]="model['loanRole']"
    [options]="loanRoleOptions()"
    [ariaLabel]="i18n.t('form.movement.field.loanRole')"
  />
</fin-field>
} @if (showLoanProduct()) {
<fin-field [label]="i18n.t('form.movement.field.loanProduct')">
  <fin-select
    name="loanProduct"
    [(ngModel)]="model['loanProduct']"
    [options]="loanProductOptions()"
    [ariaLabel]="i18n.t('form.movement.field.loanProduct')"
  />
</fin-field>
}
