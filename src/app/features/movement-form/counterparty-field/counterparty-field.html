<fin-field data-tour="form-contraparte" [label]="label()">
  <div class="flex items-center gap-2">
    <fin-select
      class="min-w-0 flex-1"
      name="counterpartyId"
      [(ngModel)]="model['counterpartyId']"
      [options]="opciones()"
      [ariaLabel]="label()"
    />
    @if (puedeCrear()) {
    <button
      data-tour="form-contraparte-nueva"
      hlmBtn
      type="button"
      variant="outline"
      size="icon"
      [attr.aria-label]="textoAgregar()"
      [attr.aria-expanded]="creando()"
      (click)="creando.set(!creando())"
    >
      <fin-icon name="plus" />
    </button>
    }
  </div>
</fin-field>
@if (creando()) {
<fin-field data-tour="form-contraparte-alta" [label]="textoAgregar()">
  <div class="flex items-center gap-2">
    <input
      hlmInput
      class="min-w-0 flex-1"
      type="text"
      name="nuevaContraparte"
      [ngModel]="nombreNuevo()"
      (ngModelChange)="nombreNuevo.set($event)"
      (keydown.enter)="$event.preventDefault(); agregar()"
    />
    @if (esPersonaNueva()) {
    <fin-select
      data-tour="form-contraparte-relacion"
      class="w-40 shrink-0"
      name="relacionNuevaContraparte"
      [ngModel]="relacionNueva()"
      (ngModelChange)="relacionNueva.set($event)"
      [options]="relationshipOptions()"
      [ariaLabel]="i18n.t('form.management.field.relationship')"
    />
    }
    <button hlmBtn type="button" size="sm" [disabled]="!nombreNuevo().trim() || guardando()" (click)="agregar()">
      {{ i18n.t('form.actions.add') }}
    </button>
  </div>
</fin-field>
}
