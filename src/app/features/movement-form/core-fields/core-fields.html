<fin-field [label]="i18n.t('form.movement.field.date')">
  <fin-date-field name="date" [(ngModel)]="model['date']" required />
</fin-field>
<fin-field [label]="sourceAccountLabel()">
  <fin-select
    name="accountId"
    [(ngModel)]="model['accountId']"
    [options]="accountOptions()"
    [ariaLabel]="sourceAccountLabel()"
  />
</fin-field>
@if (showTargetAccount) {
<fin-field [label]="i18n.t('form.movement.field.targetAccount')">
  <fin-select
    name="targetId"
    [(ngModel)]="model['targetId']"
    [options]="targetAccountOptions()"
    [ariaLabel]="i18n.t('form.movement.field.targetAccount')"
  />
</fin-field>
}
<fin-field [label]="i18n.t('form.movement.field.description')" [full]="true">
  <input hlmInput type="text" name="description" [(ngModel)]="model['description']" required />
</fin-field>
<fin-field [label]="i18n.t('form.field.amount')">
  <input hlmInput type="number" name="amount" min="1" [(ngModel)]="model['amount']" required />
</fin-field>
