<fin-field data-tour="form-fecha" [label]="i18n.t('form.movement.field.date')">
  <fin-date-field name="date" [(ngModel)]="model['date']" required />
</fin-field>
<fin-field data-tour="form-monto" [label]="i18n.t('form.field.amount')">
  <input hlmInput finMonto name="amount" min="1" [(ngModel)]="model['amount']" required />
</fin-field>
@if (showAccount()) {
<fin-field data-tour="form-cuenta" [label]="sourceAccountLabel()">
  <div class="flex items-center gap-2">
    <fin-select
      class="min-w-0 flex-1"
      name="accountId"
      [(ngModel)]="model['accountId']"
      [options]="accountOptions()"
      [ariaLabel]="sourceAccountLabel()"
    />
    <fin-crear-cuenta-al-vuelo
      dataTour="form-cuenta-nueva"
      [propuesta]="propuestaOrigen()"
      (creada)="elegirCuenta('accountId', $event)"
    />
  </div>
</fin-field>
} @if (showTargetAccount()) {
<fin-field data-tour="form-cuenta-destino" [label]="targetAccountLabel()">
  <div class="flex items-center gap-2">
    <fin-select
      class="min-w-0 flex-1"
      name="targetId"
      [(ngModel)]="model['targetId']"
      [options]="targetAccountOptions()"
      [ariaLabel]="targetAccountLabel()"
    />
    <fin-crear-cuenta-al-vuelo
      dataTour="form-cuenta-destino-nueva"
      [propuesta]="propuestaDestino()"
      (creada)="elegirCuenta('targetId', $event)"
    />
  </div>
</fin-field>
}
