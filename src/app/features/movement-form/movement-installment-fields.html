<label class="field"
  >{{ i18n.t('form.movement.field.installmentTotal') }}<input
    type="number"
    name="installmentTotal"
    min="1"
    [(ngModel)]="model['installmentTotal']"
/></label>
<label class="field"
  >{{ i18n.t('form.movement.field.installmentCurrent') }}<input
    type="number"
    name="installmentCurrent"
    min="1"
    [disabled]="!currentEditable"
    [(ngModel)]="model['installmentCurrent']"
/></label>
