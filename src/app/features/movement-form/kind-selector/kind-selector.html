<hlm-tabs [tab]="kind" (tabActivated)="kindChange.emit($event)">
  <hlm-tabs-list class="grid h-11 w-full auto-cols-fr grid-flow-col" [attr.aria-label]="ariaLabel">
    @for (t of options; track t.value) {
    <button [hlmTabsTrigger]="t.value" class="h-full gap-2 px-5 font-semibold whitespace-nowrap">
      @if (iconOf(t.value); as icon) {
      <fin-icon [name]="icon" />
      } {{ t.label }}
    </button>
    }
  </hlm-tabs-list>
</hlm-tabs>
