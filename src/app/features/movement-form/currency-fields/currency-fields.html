<fin-field data-tour="form-moneda-original" [label]="i18n.t('form.movement.field.originalAmount')">
  <input hlmInput finMonto name="originalAmount" min="0" step="0.01" [(ngModel)]="model['originalAmount']" />
</fin-field>
<fin-field data-tour="form-tasa-cambio" [label]="i18n.t('form.movement.field.exchangeRate')">
  <input hlmInput finMonto name="exchangeRate" min="0" [(ngModel)]="model['exchangeRate']" />
</fin-field>
<p class="col-span-full text-xs font-normal text-muted-foreground">
  {{ i18n.t('form.movement.field.officialTrm') }}: @if (officialTrmLoading()) { {{ i18n.t('form.movement.trm.loading')
  }} } @else if (officialTrm() !== null) {
  <strong>{{ officialTrm() }}</strong>
  } @else { {{ i18n.t('form.movement.trm.unavailable') }} }
</p>
