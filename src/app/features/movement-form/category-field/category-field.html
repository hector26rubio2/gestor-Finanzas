<fin-field data-tour="form-categoria" [label]="i18n.t('form.movement.field.category')">
  <div class="flex items-center gap-2">
    <fin-select
      class="min-w-0 flex-1"
      name="category"
      [(ngModel)]="model['category']"
      [options]="categoryOptions()"
      [ariaLabel]="i18n.t('form.movement.field.category')"
    />
    @if (puedeCrear()) {
    <fin-boton-de-alta
      data-tour="form-categoria-nueva"
      [etiqueta]="i18n.t('form.movement.category.add')"
      [abierto]="creando()"
      (alternar)="creando.set(!creando())"
    />
    }
  </div>
</fin-field>
@if (creando()) {
<fin-field
  finCancelarConEscape
  (cancelar)="creando.set(false)"
  data-tour="form-categoria-alta"
  [label]="i18n.t('form.movement.category.add')"
>
  <div class="flex items-center gap-2">
    <input
      hlmInput
      class="min-w-0 flex-1"
      type="text"
      name="nuevaCategoria"
      [ngModel]="nombreNuevo()"
      (ngModelChange)="nombreNuevo.set($event)"
      (keydown.enter)="$event.preventDefault(); agregar()"
    />
    <button hlmBtn type="button" size="sm" [disabled]="!nombreNuevo().trim() || guardando()" (click)="agregar()">
      {{ i18n.t('form.actions.add') }}
    </button>
  </div>
</fin-field>
}
