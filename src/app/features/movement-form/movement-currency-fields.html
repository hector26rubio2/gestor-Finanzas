<label class="field"
  >{{ i18n.t('form.movement.field.originalAmount') }}<input
    type="number"
    name="originalAmount"
    min="0"
    step="0.01"
    [(ngModel)]="model['originalAmount']"
/></label>
<label class="field"
  >{{ i18n.t('form.movement.field.exchangeRate') }}<input
    type="number"
    name="exchangeRate"
    min="0"
    [(ngModel)]="model['exchangeRate']"
/></label>
<p class="field field-full trm-reference">
  {{ i18n.t('form.movement.field.officialTrm') }}: @if (officialTrmLoading()) { {{ i18n.t('form.movement.trm.loading')
  }} } @else if (officialTrm() !== null) {
  <strong>{{ officialTrm() }}</strong>
  } @else { {{ i18n.t('form.movement.trm.unavailable') }} }
</p>
