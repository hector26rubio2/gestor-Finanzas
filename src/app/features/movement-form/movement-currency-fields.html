<fin-field [label]="i18n.t('form.movement.field.originalAmount')">
  <input hlmInput type="number" name="originalAmount" min="0" step="0.01" [(ngModel)]="model['originalAmount']" />
</fin-field>
<fin-field [label]="i18n.t('form.movement.field.exchangeRate')">
  <input hlmInput type="number" name="exchangeRate" min="0" [(ngModel)]="model['exchangeRate']" />
</fin-field>
<p class="col-span-full text-[0.78rem] font-normal text-muted-foreground">
  {{ i18n.t('form.movement.field.officialTrm') }}: @if (officialTrmLoading()) { {{ i18n.t('form.movement.trm.loading')
  }} } @else if (officialTrm() !== null) {
  <strong>{{ officialTrm() }}</strong>
  } @else { {{ i18n.t('form.movement.trm.unavailable') }} }
</p>
