<fin-kpi-grid>
  @if (can(P.personas.deudas.listar)) {
  <fin-kpi
    [label]="i18n.t('people.kpi.owed.label')"
    icon="trendUp"
    tone="success"
    [value]="store.money(peopleOwed())"
    [hint]="i18n.t('people.kpi.owed.hint')"
  />
  } @if (can(P.personas.obligaciones.listar)) {
  <fin-kpi
    [label]="i18n.t('people.kpi.owing.label')"
    icon="trendDown"
    tone="danger"
    [value]="store.money(peopleOwing())"
    [hint]="i18n.t('people.kpi.owing.hint')"
  />
  }
  <fin-kpi
    [label]="i18n.t('people.kpi.count.label')"
    icon="people"
    [value]="store.data().people.length.toString()"
    [hint]="i18n.t('people.kpi.count.hint')"
  />
  <fin-kpi
    [label]="i18n.t('people.kpi.slowest.label')"
    icon="clock"
    [value]="slowestPayer().name"
    [hint]="i18n.t(slowestPayer().hintKey, { days: slowestPayer().days })"
  />
</fin-kpi-grid>
<fin-chart-card
  class="shrink-0"
  [title]="i18n.t('people.chart.balances')"
  [description]="i18n.t('people.chart.balancesHint')"
  [option]="balancesOption()"
  [hasData]="hasBalances()"
  [empty]="i18n.t('people.chart.empty')"
/>
<fin-table-zone class="min-h-[360px]">
  <fin-table [columns]="peopleColumns()" [rows]="peopleRows()" (rowSelected)="store.inspect('person', $event['id'])" />
</fin-table-zone>
