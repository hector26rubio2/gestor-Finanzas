<fin-kpi-grid>
  <fin-kpi
    [label]="i18n.t('accounts.kpi.available.label')"
    icon="wallet"
    tone="success"
    [value]="store.money(store.available())"
    [hint]="i18n.t('accounts.kpi.available.hint')"
  />
  <fin-kpi
    [label]="i18n.t('accounts.kpi.debt.label')"
    icon="trendDown"
    tone="danger"
    [value]="store.money(store.debt())"
    [hint]="i18n.t('accounts.kpi.debt.hint')"
  />
  <fin-kpi
    [label]="i18n.t('accounts.kpi.count.label')"
    icon="accounts"
    [value]="store.data().accounts.length.toString()"
    [hint]="i18n.t('accounts.kpi.count.hint')"
  />
  @let due = nextDue();
  <fin-kpi
    [label]="i18n.t('accounts.kpi.nextDue.label')"
    icon="calendar"
    tone="danger"
    [value]="due ? due.account.name : i18n.t('accounts.kpi.none')"
    [hint]="due ? i18n.t('accounts.kpi.nextDue.hint', { days: due.days, date: due.date }) : i18n.t('accounts.kpi.nextDue.empty')"
  />
  @let used = mostUsed();
  <fin-kpi
    [label]="i18n.t('accounts.kpi.mostUsed.label')"
    icon="accounts"
    [value]="used ? used.account.name : i18n.t('accounts.kpi.none')"
    [hint]="used ? i18n.t('accounts.kpi.mostUsed.hint', { count: used.movements }) : i18n.t('accounts.kpi.mostUsed.empty')"
  />
  @let over = mostOverextended();
  <fin-kpi
    [label]="i18n.t('accounts.kpi.overextended.label')"
    icon="warning"
    [tone]="over && over.percent > healthyPercent ? 'danger' : 'success'"
    [value]="over ? over.account.name + ' · ' + over.percent + '%'  : i18n.t('accounts.kpi.none')"
    [hint]="over ? i18n.t(over.overHealthyPoints > 0 ? 'accounts.kpi.overextended.above' : 'accounts.kpi.overextended.below', { points: over.overHealthyPoints < 0 ? -over.overHealthyPoints : over.overHealthyPoints, healthy: healthyPercent }) : i18n.t('accounts.kpi.overextended.empty')"
  />
</fin-kpi-grid>
<section
  class="grid grid-cols-[minmax(220px,1fr)_minmax(170px,240px)_auto] items-end gap-2.5 rounded-xl border border-border bg-card px-3 py-[11px] max-[700px]:grid-cols-1"
  [attr.aria-label]="i18n.t('accounts.filters.ariaLabel')"
>
  <label class="grid gap-[5px] text-[0.72rem] text-muted-foreground"
    ><span>{{ i18n.t('accounts.filters.search.label') }}</span>
    <fin-search-field
      [value]="accountQuery()"
      (valueChange)="setAccountQuery($event)"
      [placeholder]="i18n.t('accounts.filters.search.placeholder')"
      [ariaLabel]="i18n.t('accounts.filters.search.label')"
    />
  </label>
  <label class="grid gap-[5px] text-[0.72rem] text-muted-foreground"
    ><span>{{ i18n.t('accounts.filters.type.label') }}</span
    ><fin-select
      [ngModel]="accountType()"
      (ngModelChange)="setAccountType($event)"
      [options]="book.accountTypeOptions()"
      [ariaLabel]="i18n.t('accounts.filters.type.label')"
  /></label>
  <span class="self-center text-[0.72rem] whitespace-nowrap text-muted-foreground"
    >{{ i18n.t('accounts.filters.resultsCount', { count: filteredAccounts().length }) }}</span
  >
</section>
<div
  class="flex flex-nowrap gap-2 overflow-x-auto pb-1 [scrollbar-width:thin]"
  role="tablist"
  tabindex="0"
  [attr.aria-label]="i18n.t('accounts.cards.listAriaLabel')"
>
  <button
    hlmBtn
    variant="outline"
    size="sm"
    type="button"
    role="tab"
    class="flex-none rounded-full text-[0.78rem] data-[active=true]:border-primary data-[active=true]:bg-accent data-[active=true]:text-primary"
    [attr.data-active]="selectedAccountFilter() === 'all'"
    [attr.aria-selected]="selectedAccountFilter() === 'all'"
    (click)="filterByAccount('all')"
  >
    {{ i18n.t('accounts.cards.allChip') }}
  </button>
  @for (a of filteredAccounts(); track a.id) {
  <button
    hlmBtn
    variant="outline"
    size="sm"
    type="button"
    role="tab"
    class="flex-none rounded-full text-[0.78rem] data-[active=true]:border-primary data-[active=true]:bg-accent data-[active=true]:text-primary"
    [attr.data-active]="selectedAccountFilter() === a.id"
    [attr.aria-selected]="selectedAccountFilter() === a.id"
    (click)="selectAccount(a.id, a.type)"
  >
    {{ a.name }}
  </button>
  }
</div>
<fin-table-zone>
  <fin-table
    [columns]="book.movementColumns()"
    [rows]="accountMovementRows()"
    [pageSize]="store.remoteMovementSize()"
    [totalRows]="store.runtime.mode === 'api' ? store.remoteMovementTotal() : null"
    [remotePage]="store.remoteMovementPage()"
    (pageSizeChange)="book.changeMovementPageSize($event)"
    (pageChange)="book.loadMovementPage($event)"
    (rowSelected)="book.inspectMovement($event)"
  />
</fin-table-zone>
