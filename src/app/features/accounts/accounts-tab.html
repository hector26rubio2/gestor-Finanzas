<section class="account-kpis kpis mini">
  <demo-kpi
    [label]="i18n.t('accounts.kpi.available.label')"
    icon="wallet"
    tone="success"
    [value]="store.money(store.available())"
    [hint]="i18n.t('accounts.kpi.available.hint')"
  />
  <demo-kpi
    [label]="i18n.t('accounts.kpi.debt.label')"
    icon="trendDown"
    tone="danger"
    [value]="store.money(store.debt())"
    [hint]="i18n.t('accounts.kpi.debt.hint')"
  />
  <demo-kpi
    [label]="i18n.t('accounts.kpi.count.label')"
    icon="accounts"
    [value]="store.data().accounts.length.toString()"
    [hint]="i18n.t('accounts.kpi.count.hint')"
  />
</section>
<section class="account-tools" [attr.aria-label]="i18n.t('accounts.filters.ariaLabel')">
  <label
    ><span>{{ i18n.t('accounts.filters.search.label') }}</span>
    <div class="search-control">
      <demo-icon name="search" />
      <input
        type="search"
        [attr.placeholder]="i18n.t('accounts.filters.search.placeholder')"
        [ngModel]="accountQuery()"
        (ngModelChange)="setAccountQuery($event)"
      />
    </div>
  </label>
  <label
    ><span>{{ i18n.t('accounts.filters.type.label') }}</span
    ><demo-select
      [ngModel]="accountType()"
      (ngModelChange)="setAccountType($event)"
      [options]="book.accountTypeOptions()"
      [ariaLabel]="i18n.t('accounts.filters.type.label')"
  /></label>
  <span>{{ i18n.t('accounts.filters.resultsCount', { count: filteredAccounts().length }) }}</span>
</section>
<section class="cards" [class.compact]="compactCards()">
  <div class="card-strip" tabindex="0" [attr.aria-label]="i18n.t('accounts.cards.listAriaLabel')">
    @for (a of visibleAccounts(); track a.id) {
    <button
      class="bank-card"
      [style.--card-color]="a.color"
      [class.active]="selectedAccountFilter() === a.id"
      (click)="selectAccount(a.id, a.type)"
    >
      <span
        >{{ a.type === 'credit' ? i18n.t('accounts.cards.type.credit') : a.type === 'savings' ?
        i18n.t('accounts.cards.type.savings') : i18n.t('accounts.cards.type.cash') }}</span
      ><b>{{ a.name }}</b><em>{{ a.lastFour ? '•••• ' + a.lastFour : i18n.t('accounts.cards.noLastFour') }}</em
      ><small
        >{{ a.type === 'credit' ? i18n.t('accounts.cards.debtLabel') : i18n.t('accounts.cards.balanceLabel') }}
        <strong>{{ store.money(displayBalance(a)) }}</strong></small
      >
    </button>
    }
  </div>
  @if (filteredAccounts().length > accountPageSize) {
  <nav class="card-pages" [attr.aria-label]="i18n.t('accounts.pagination.ariaLabel')">
    <button (click)="accountPage.update((p) => Math.max(0, p - 1))" [disabled]="accountPage() === 0">‹</button
    ><span>{{ accountPage() + 1 }} / {{ accountPageCount() }}</span
    ><button
      (click)="accountPage.update((p) => Math.min(accountPageCount() - 1, p + 1))"
      [disabled]="accountPage() >= accountPageCount() - 1"
    >
      ›
    </button>
  </nav>
  }
  <button class="compact-toggle" (click)="compactCards.update((v) => !v)">
    {{ compactCards() ? i18n.t('accounts.cards.expand') : i18n.t('accounts.cards.compact') }}
  </button>
</section>
<section class="table-zone">
  <demo-table
    [columns]="book.movementColumns()"
    [rows]="accountMovementRows()"
    [pageSize]="store.remoteMovementSize()"
    [totalRows]="store.runtime.mode === 'api' ? store.remoteMovementTotal() : null"
    [remotePage]="store.remoteMovementPage()"
    (pageSizeChange)="compactCards.set($event > 5); book.changeMovementPageSize($event)"
    (pageChange)="book.loadMovementPage($event)"
    (rowSelected)="book.inspectMovement($event)"
  />
</section>
