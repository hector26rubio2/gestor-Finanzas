<section class="sin-seccion" role="status">
  @if (haySesion()) {
  <h1>{{ i18n.t('sinSeccion.withSession.title') }}</h1>
  <p>{{ i18n.t('sinSeccion.withSession.detail') }}</p>
  <button type="button" (click)="reintentar()">{{ i18n.t('sinSeccion.withSession.retry') }}</button>
  } @else {
  <h1>{{ i18n.t('sinSeccion.noSession.title') }}</h1>
  <p>{{ i18n.t('sinSeccion.noSession.detail') }}</p>
  <a routerLink="/login">{{ i18n.t('sinSeccion.noSession.goToLogin') }}</a>
  }
</section>
