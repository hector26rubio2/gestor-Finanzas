<div
  class="relative h-full rounded-lg"
  [class.outline-1]="editable()"
  [class.outline-dashed]="editable()"
  [class.outline-primary/40]="editable()"
  [class.outline-offset-2]="editable()"
>
  <ng-content />
  @if (editable()) {
  <button
    cdkDragHandle
    type="button"
    class="absolute -top-3 left-1/2 z-10 flex h-6 w-11 -translate-x-1/2 cursor-grab touch-none items-center justify-center rounded-full border border-border bg-card text-muted-foreground shadow-sm outline-none hover:text-primary focus-visible:ring-[3px] focus-visible:ring-ring/50 active:cursor-grabbing"
    [attr.aria-label]="i18n.t('dashboard.layout.drag')"
    [attr.title]="i18n.t('dashboard.layout.drag')"
    (keydown)="moveByKey($event)"
  >
    <fin-icon name="gripHorizontal" />
  </button>
  <div
    role="slider"
    tabindex="0"
    class="group absolute inset-y-4 -right-1.5 z-10 flex w-3 cursor-ew-resize touch-none items-center justify-center outline-none max-[700px]:hidden"
    [attr.aria-label]="i18n.t('dashboard.layout.resizeWidth')"
    [attr.aria-valuemin]="minCols()"
    aria-valuemax="12"
    [attr.aria-valuenow]="item().cols"
    (pointerdown)="startResize($event, 'x')"
    (pointermove)="resize($event)"
    (pointerup)="endResize()"
    (pointercancel)="endResize()"
    (keydown)="resizeByKey($event, 'x')"
  >
    <span
      class="h-10 w-1 rounded-full bg-border transition-colors group-hover:bg-primary group-focus-visible:bg-primary"
    ></span>
  </div>
  <div
    role="slider"
    tabindex="0"
    class="group absolute inset-x-4 -bottom-1.5 z-10 flex h-3 cursor-ns-resize touch-none items-center justify-center outline-none"
    [attr.aria-label]="i18n.t('dashboard.layout.resizeHeight')"
    [attr.aria-valuenow]="item().height"
    (pointerdown)="startResize($event, 'y')"
    (pointermove)="resize($event)"
    (pointerup)="endResize()"
    (pointercancel)="endResize()"
    (keydown)="resizeByKey($event, 'y')"
  >
    <span
      class="h-1 w-10 rounded-full bg-border transition-colors group-hover:bg-primary group-focus-visible:bg-primary"
    ></span>
  </div>
  <div
    role="slider"
    tabindex="0"
    class="group absolute -right-1.5 -bottom-1.5 z-20 size-4 cursor-nwse-resize touch-none outline-none max-[700px]:hidden"
    [attr.aria-label]="i18n.t('dashboard.layout.resizeBoth')"
    [attr.aria-valuenow]="item().cols"
    (pointerdown)="startResize($event, 'xy')"
    (pointermove)="resize($event)"
    (pointerup)="endResize()"
    (pointercancel)="endResize()"
    (keydown)="resizeByKey($event, 'xy')"
  >
    <span
      class="absolute right-0.5 bottom-0.5 size-2.5 rounded-br-sm border-r-2 border-b-2 border-muted-foreground transition-colors group-hover:border-primary group-focus-visible:border-primary"
    ></span>
  </div>
  }
</div>
