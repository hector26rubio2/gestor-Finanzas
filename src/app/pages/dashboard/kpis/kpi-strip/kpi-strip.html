<section class="flex flex-col gap-4" aria-label="Indicadores filtrados">
  <div
    cdkDropList
    cdkDropListOrientation="mixed"
    class="grid grid-cols-12 auto-rows-[10px] gap-x-5 [grid-auto-flow:row_dense]"
    (cdkDropListDropped)="dropped($event)"
  >
    @for (item of flow(); track item.id) { @if (entry(item.id); as entry) {
    <fin-flow-item
      [item]="item"
      [editable]="resizable()"
      [minCols]="minCols"
      (resized)="resize.emit({ id: item.id, change: $event })"
      (moved)="move.emit({ id: item.id, direction: $event })"
    >
      <fin-kpi
        class="h-full"
        [label]="entry.card.label"
        [icon]="entry.card.icon"
        [tone]="entry.card.tone"
        [value]="entry.card.value"
        [hint]="entry.card.hint"
        [series]="entry.card.series"
        [delta]="entry.card.delta"
        [subirEsBueno]="entry.card.subirEsBueno"
        [progress]="entry.card.progress ?? null"
        [status]="entry.card.status ?? null"
        [caption]="entry.card.caption ?? ''"
      />
      @if (resizable()) {
      <div class="absolute top-2 right-2 z-20 flex items-center gap-0.5 rounded-md bg-card/90">
        <fin-kpi-ranges-editor
          [label]="entry.card.label"
          [ranges]="entry.card.ranges ?? null"
          (change)="rangesChange.emit({ id: item.id, ranges: $event })"
        />
        @if (entry.customId && canRemove()) {
        <button
          hlmBtn
          variant="ghost"
          size="icon-xs"
          type="button"
          [attr.aria-label]="i18n.t('dashboard.kpi.remove.ariaLabel')"
          (click)="removeKpi.emit(entry.customId)"
        >
          <fin-icon name="close" />
        </button>
        }
      </div>
      }
    </fin-flow-item>
    } }
  </div>
  @if (canCreate()) {
  <button
    hlmBtn
    variant="outline"
    type="button"
    class="min-h-[84px] justify-center gap-2 rounded-lg border-dashed text-muted-foreground hover:border-primary hover:bg-accent hover:text-primary"
    (click)="openCreator.emit()"
  >
    <fin-icon name="plus" /> {{ i18n.t('dashboard.actions.createIndicator') }}
  </button>
  }
</section>
