<section
  class="grid grid-cols-4 gap-4 max-[820px]:grid-cols-2 max-[470px]:grid-cols-1"
  aria-label="Indicadores filtrados"
>
  @for (kpi of fixedKpis(); track kpi.label) {
  <fin-kpi
    [label]="kpi.label"
    [icon]="kpi.icon"
    [tone]="kpi.tone"
    [value]="kpi.value"
    [hint]="kpi.hint"
    [series]="kpi.series"
    [delta]="kpi.delta"
    [subirEsBueno]="kpi.subirEsBueno"
  />
  } @for (kpi of customKpis(); track kpi.id) {
  <div class="relative min-w-0">
    <fin-kpi
      [label]="kpi.label"
      [icon]="kpi.icon"
      [tone]="kpi.tone"
      [value]="kpi.value"
      [hint]="kpi.hint"
      [series]="kpi.series"
      [delta]="kpi.delta"
      [subirEsBueno]="kpi.subirEsBueno"
    />
    @if (canRemove()) {
    <button
      hlmBtn
      variant="ghost"
      size="icon-xs"
      type="button"
      class="absolute top-2 right-2"
      [attr.aria-label]="i18n.t('dashboard.kpi.remove.ariaLabel')"
      (click)="removeKpi.emit(kpi.id)"
    >
      <fin-icon name="close" />
    </button>
    }
  </div>
  } @if (canCreate()) {
  <button
    hlmBtn
    variant="outline"
    type="button"
    class="min-h-[108px] justify-center gap-2 rounded-lg border-dashed text-muted-foreground hover:border-primary hover:bg-accent hover:text-primary"
    (click)="openCreator.emit()"
  >
    <fin-icon name="plus" /> {{ i18n.t('dashboard.actions.createIndicator') }}
  </button>
  }
</section>
