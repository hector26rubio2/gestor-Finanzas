<section class="kpis" aria-label="Indicadores filtrados">
  @for (kpi of fixedKpis(); track kpi.label) {
  <fin-kpi
    [label]="kpi.label"
    [icon]="kpi.icon"
    [tone]="kpi.tone"
    [value]="kpi.value"
    [hint]="kpi.hint"
    [series]="kpi.series"
    [delta]="kpi.delta"
    [subirEsBueno]="kpi.subirEsBueno"
  />
  } @for (kpi of customKpis(); track kpi.id) {
  <div class="custom-kpi">
    <fin-kpi
      [label]="kpi.label"
      [icon]="kpi.icon"
      [tone]="kpi.tone"
      [value]="kpi.value"
      [hint]="kpi.hint"
      [series]="kpi.series"
      [delta]="kpi.delta"
      [subirEsBueno]="kpi.subirEsBueno"
    />
    @if (canRemove()) {
    <button
      type="button"
      class="quiet custom-kpi-remove"
      [attr.aria-label]="i18n.t('dashboard.kpi.remove.ariaLabel')"
      (click)="removeKpi.emit(kpi.id)"
    >
      <fin-icon name="close" />
    </button>
    }
  </div>
  } @if (canCreate()) {
  <button type="button" class="add-kpi" (click)="openCreator.emit()">
    <fin-icon name="plus" /> {{ i18n.t('dashboard.actions.createIndicator') }}
  </button>
  }
</section>
