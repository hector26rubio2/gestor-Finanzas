<fin-overlay [title]="i18n.t('dashboard.actions.createWidget')" mode="modal" [wide]="true" (closed)="cerrado.emit()">
  <form class="grid gap-4" (submit)="crear($event)">
    <div class="grid grid-cols-2 gap-3 max-[640px]:grid-cols-1">
      <fin-field [label]="i18n.t('dashboard.widgetForm.name')">
        <input hlmInput name="widgetTitle" [(ngModel)]="newWidgetTitle" required maxlength="48" />
      </fin-field>
      <fin-field [label]="i18n.t('dashboard.widgetForm.distribution')">
        <fin-select
          name="widgetWidth"
          [(ngModel)]="newWidgetWidth"
          [options]="widthOptions()"
          [ariaLabel]="i18n.t('dashboard.widgetForm.distribution.ariaLabel')"
        />
      </fin-field>
    </div>
    <div class="grid grid-cols-[minmax(0,1fr)_minmax(0,1.1fr)] gap-5 max-[900px]:grid-cols-1">
      <div class="flex max-h-[62vh] min-w-0 flex-col gap-4 overflow-y-auto pe-1">
        <fin-galeria-visual [valor]="otroTipo() ? '' : nuevoVisual().tipo" (valorChange)="elegirTipoDelMotor($event)" />
        <fin-field [label]="i18n.t('charts.group.others')">
          <fin-select
            name="otroTipo"
            [ngModel]="otroTipo()"
            (ngModelChange)="otroTipo.set($event)"
            [options]="[{ value: '', label: '—' }].concat(otherTypeOptions())"
            [ariaLabel]="i18n.t('charts.group.others')"
          />
        </fin-field>
      </div>
      <div class="flex min-w-0 flex-col gap-3">
        @if (!otroTipo()) {
        <fin-configurador-visual [conTipo]="false" [(config)]="nuevoVisual" />
        @if (vistaPrevia(); as opcion) {
        <div class="rounded-lg border border-border bg-card p-3">
          <fin-chart [option]="opcion" [height]="300" [ariaLabel]="newWidgetTitle || i18n.t('charts.picker.label')" />
        </div>
        } } @else { @if (isGeneric(newWidgetMetric)) {
        <fin-field [label]="i18n.t('dashboard.widgetForm.dimensionAxis')">
          <fin-select
            name="widgetDimension"
            [(ngModel)]="newWidgetDimension"
            [options]="dimensionOptions()"
            [ariaLabel]="i18n.t('dashboard.widgetActions.dimension.ariaLabel')"
          />
        </fin-field>
        <fin-field [label]="i18n.t('dashboard.widgetForm.measureValue')">
          <fin-select
            name="widgetMeasure"
            [(ngModel)]="newWidgetMeasure"
            [options]="measureOptions()"
            [ariaLabel]="i18n.t('dashboard.widgetActions.measure.ariaLabel')"
          />
        </fin-field>
        } @if (needsGoal(newWidgetMetric)) {
        <fin-field [label]="i18n.t('dashboard.widgetActions.goalMin.ariaLabel')">
          <input hlmInput name="widgetGoalMin" type="number" [(ngModel)]="newWidgetGoalMin" />
        </fin-field>
        <fin-field [label]="i18n.t('dashboard.widgetActions.goalTarget.ariaLabel')">
          <input hlmInput name="widgetGoalTarget" type="number" [(ngModel)]="newWidgetGoalTarget" />
        </fin-field>
        <fin-field [label]="i18n.t('dashboard.widgetActions.goalMax.ariaLabel')">
          <input hlmInput name="widgetGoalMax" type="number" [(ngModel)]="newWidgetGoalMax" />
        </fin-field>
        } }
      </div>
    </div>
    <p class="text-[0.8rem] text-muted-foreground">{{ i18n.t('dashboard.widgetForm.note') }}</p>
    <div class="flex justify-end gap-2">
      <button hlmBtn variant="outline" type="button" (click)="cerrado.emit()">
        <fin-icon name="close" /> {{ i18n.t('dashboard.widgetForm.cancel') }}</button
      ><button hlmBtn type="submit">{{ i18n.t('dashboard.widgetForm.submit') }}</button>
    </div>
  </form>
</fin-overlay>
