<demo-overlay [title]="i18n.t('form.account.title.create')" mode="modal" (closed)="closed()"
  ><form (ngSubmit)="save()">
    <label
      >{{ i18n.t('form.account.field.type') }}<demo-select
        name="type"
        [(ngModel)]="type"
        [options]="accountTypes()"
        [ariaLabel]="i18n.t('form.account.field.typeAria')"
    /></label
    ><label>{{ i18n.t('form.field.name') }}<input name="name" [(ngModel)]="name" required /></label
    ><label
      >{{ i18n.t('form.field.currency') }}<demo-select
        name="currency"
        [(ngModel)]="currency"
        [options]="currencyOptions()"
        [ariaLabel]="i18n.t('form.field.currency')" /></label
    ><label
      >{{ i18n.t('form.account.field.opening') }}<input name="opening" [(ngModel)]="opening" type="number" /></label>
    @if (currency === 'USD') {
    <label
      >{{ i18n.t('form.account.field.exchangeRate') }}<input
        name="exchangeRate"
        [(ngModel)]="exchangeRate"
        type="number"
        min="1"
    /></label>
    } @if (type === 'credit') {
    <label
      >{{ i18n.t('form.account.field.limit') }}<input name="limit" [(ngModel)]="limit" type="number" min="1" required
    /></label>
    <label
      >{{ i18n.t('form.account.field.cutDay') }}<input
        name="cutDay"
        [(ngModel)]="cutDay"
        type="number"
        min="1"
        max="31"
        required
    /></label>
    <label
      >{{ i18n.t('form.account.field.dueDay') }}<input
        name="dueDay"
        [(ngModel)]="dueDay"
        type="number"
        min="1"
        max="31"
        required
    /></label>
    <label
      >{{ i18n.t('form.account.field.annualRate') }}<input
        name="annualRate"
        [(ngModel)]="annualRate"
        type="number"
        min="0"
        step="0.01"
    /></label>
    <label
      >{{ i18n.t('form.account.field.paymentOrder') }}<demo-select
        name="paymentOrder"
        [(ngModel)]="paymentOrder"
        [options]="paymentOrderOptions()"
        [ariaLabel]="i18n.t('form.account.field.paymentOrder')"
    /></label>
    <label
      >{{ i18n.t('form.account.field.paymentPriority') }}<demo-select
        name="paymentPriority"
        [(ngModel)]="paymentPriority"
        [options]="paymentPriorityOptions()"
        [ariaLabel]="i18n.t('form.account.field.paymentPriorityAria')"
    /></label>
    <label
      >{{ i18n.t('form.account.field.minimumPayment') }}<input
        name="minimumPayment"
        [(ngModel)]="minimumPayment"
        type="number"
        min="0"
    /></label>
    }
    <p>{{ i18n.t('form.account.hint.opening') }}</p>
    @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
    }
    <footer>
      <button type="button" (click)="closed()">{{ i18n.t('form.actions.cancel') }}</button
      ><button class="primary" type="submit">{{ i18n.t('form.account.actions.create') }}</button>
    </footer>
  </form></demo-overlay
>
